<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão dos Amigos PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- CABEÇALHO -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 px-4 py-3">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="bg-emerald-600/20 border border-emerald-500/30 p-2 rounded-xl text-emerald-400">
                    <i class="fa-solid fa-trophy text-lg"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base text-emerald-400">BOLÃO DOS AMIGOS</h1>
                    <p class="text-[10px] text-slate-400 font-medium">1 Ponto por Acerto • Vencedor ou Empate</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <span class="text-[10px] text-slate-400 hidden sm:inline">Você é:</span>
                <select id="select-usuario" onchange="mudarUsuarioAtivo(this.value)" class="bg-slate-800 border border-slate-700 text-xs font-bold text-emerald-400 rounded-lg px-2.5 py-1.5 focus:outline-none">
                </select>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-xl w-full mx-auto p-4 flex-grow pb-20">

        <!-- ABAS DE NAVEGAÇÃO -->
        <div class="grid grid-cols-4 gap-1 bg-slate-900 border border-slate-800 p-1 rounded-xl mb-5 text-center text-xs font-semibold">
            <button type="button" onclick="mudarAba('palpites')" id="tab-btn-palpites" class="py-2.5 rounded-lg transition flex flex-col items-center gap-1 bg-emerald-600 text-white shadow">
                <i class="fa-solid fa-pen-to-square"></i> Palpites
            </button>
            <button type="button" onclick="mudarAba('ranking')" id="tab-btn-ranking" class="py-2.5 rounded-lg transition flex flex-col items-center gap-1 text-slate-400 hover:text-white">
                <i class="fa-solid fa-medal"></i> Ranking
            </button>
            <button type="button" onclick="mudarAba('regras')" id="tab-btn-regras" class="py-2.5 rounded-lg transition flex flex-col items-center gap-1 text-slate-400 hover:text-white">
                <i class="fa-solid fa-circle-info"></i> Regras
            </button>
            <button type="button" onclick="mudarAba('admin')" id="tab-btn-admin" class="py-2.5 rounded-lg transition flex flex-col items-center gap-1 text-slate-400 hover:text-white">
                <i class="fa-solid fa-gear"></i> Admin
            </button>
        </div>

        <!-- ABA 1: PALPITES -->
        <div id="tab-palpites" class="space-y-4">
            <div class="bg-slate-900 border
