<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão dos Amigos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 flex flex-col items-center">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-4">
        
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div>
                <h1 class="font-extrabold text-lg text-emerald-400">⚽ BOLÃO DOS AMIGOS</h1>
                <p class="text-xs text-slate-400">1 Ponto por Acerto de Vencedor/Empate</p>
            </div>
            <select id="usuario" onchange="mudarUser(this.value)" class="bg-slate-800 border border-slate-700 text-xs font-bold text-emerald-400 rounded-lg p-2">
                <option value="Robson">Robson</option>
                <option value="João Victor">João Victor</option>
                <option value="Rita Andrade">Rita Andrade</option>
            </select>
        </div>

        <div class="space-y-3" id="jogos-container">
            <!-- Jogos gerados via JS -->
        </div>

        <button onclick="salvarPalpites()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl text-xs transition shadow-lg">
            💾 Salvar Meus Palpites
        </button>

        <div class="border-t border-slate-800 pt-3 text-center">
            <h2 class="text-xs font-bold text-slate-300 mb-2">🏆 Ranking Atual</h2>
            <div id="ranking-box" class="text-xs text-left bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1">
                <!-- Ranking -->
            </div>
        </div>

    </div>

    <script>
        let appData = {
            usuario: "Robson",
            partidas: [
                { id: 1, casa: "Real Madrid", fora: "Barcelona", placarC: 0, placarF: 0 },
                { id: 2, casa: "Flamengo", fora: "Palmeiras", placarC: 0, placarF: 0 }
            ],
            palpites: {}
        };

        if(localStorage.getItem('bolao_simples')) {
            appData = JSON.parse(localStorage.getItem('bolao_simples'));
        }

        function mudarUser(u) {
            appData.usuario = u;
            render();
        }

        function render() {
            const container = document.getElementById('jogos-container');
            container.innerHTML = '';
            
            if(!appData.palpites[appData.usuario]) appData.palpites[appData.usuario] = {};

            appData.partidas.forEach(p => {
                let pal = appData.palpites[appData.usuario][p.id] || {c: 0, f: 0};
                container.innerHTML += `
                    <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50 flex items-center justify-between text-xs">
                        <span class="w-1/3 text-right font-bold truncate pr-2">${p.casa}</span>
                        <div class="flex items-center gap-1">
                            <input type="number" value="${pal.c}" onchange="setPal(${p.id}, 'c', this.value)" class="w-8 h-8 bg-slate-900 text-center font-bold rounded-lg border border-slate-700">
                            <span>x</span>
                            <input type="number" value="${pal.f}" onchange="setPal(${p.id}, 'f', this.value)" class="w-8 h-8 bg-slate-900 text-center font-bold rounded-lg border border-slate-700">
                        </div>
                        <span class="w-1/3 text-left font-bold truncate pl-2">${p.fora}</span>
                    </div>
                `;
            });

            // Ranking simples
            const rankBox = document.getElementById('ranking-box');
            rankBox.innerHTML = `
                <div class="flex justify-between font-bold text-slate-400 border-b border-slate-800 pb-1">
                    <span>Participante</span>
                    <span>Pontos</span>
                </div>
                <div class="flex justify-between"><span>Robson</span><span class="text-emerald-400 font-bold">0 pts</span></div>
                <div class="flex justify-between"><span>João Victor</span><span class="text-emerald-400 font-bold">0 pts</span></div>
                <div class="flex justify-between"><span>Rita Andrade</span><span class="text-emerald-400 font-bold">0 pts</span></div>
            `;
        }

        function setPal(id, campo, val) {
            if(!appData.palpites[appData.usuario]) appData.palpites[appData.usuario] = {};
            if(!appData.palpites[appData.usuario][id]) appData.palpites[appData.usuario][id] = {c:0, f:0};
            appData.palpites[appData.usuario][id][campo] = parseInt(val) || 0;
        }

        function salvarPalpites() {
            localStorage.setItem('bolao_simples', JSON.stringify(appData));
            alert("Palpites salvos com sucesso!");
        }

        render();
    </script>
</body>
</html>
